name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff-based checks below need the base revision to exist locally:
          # a shallow clone has neither HEAD^1 nor the event's base sha.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm install --save-optional --include=optional @rollup/rollup-linux-x64-gnu || true
        shell: bash
      - name: Theme colors (CI enforced)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
            export FORMAT_BASE_REF
          fi
          npm run check:theme-colors
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dependency licenses
        run: npm run licenses
      - name: English-only comments
        run: npm run check:english-comments
      # skills/<name>/SKILL.md are copied into users' agent directories and only
      # replaced when metadata.version grows, so a body edit without a version
      # bump would never be offered as an update.
      - name: Skill version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
            export FORMAT_BASE_REF
          fi
          npm run check:skills
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
      # Diff-based, so it needs a base to compare against. For a PR the checkout
      # is the merge commit and HEAD^1 is the exact base it was built against;
      # event.pull_request.base.sha can lag a fast-moving main and drag unrelated
      # files into the changed set, failing the check on untouched files.
      - name: Formatting
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
            export FORMAT_BASE_REF
          fi
          npm run format:check
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash

  tests:
    name: Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 'Core Engines (Word & Presentation)'
            packages: '@revelith/docx-engine @revelith/pptx-engine @revelith/pptx-render'
          - group: 'Spreadsheet & Calculation'
            packages: '@revelith/sheets'
          - group: 'Editors (Docs & Slides)'
            packages: '@revelith/docs @revelith/slides'
          - group: 'PDF & Markdown'
            packages: '@revelith/pdf @revelith/markdown'
          - group: 'Shell & Desktop Windowing'
            packages: '@revelith/shell'
          - group: 'Utilities, AI & Infrastructure'
            packages: '@revelith/i18n @revelith/electron-utils @revelith/font-metrics @revelith/file-parse @revelith/ai-search @revelith/agent-core @revelith/ai-provider @revelith/project-store'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: matrix.group == 'Spreadsheet & Calculation'
        with:
          workspaces: 'apps/sheets/native/xlsx-engine -> apps/sheets/native/xlsx-engine/target'
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm install --save-optional --include=optional @rollup/rollup-linux-x64-gnu || true
        shell: bash
      - name: Run Test Suite Partition
        run: |
          for pkg in ${{ matrix.packages }}; do
            npm run test -w "$pkg"
          done
        shell: bash
