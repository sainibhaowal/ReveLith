name: Update Website Release Manifest

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-website.yml
      - .github/workflows/release.yml
      - apps/web/scripts/create-release-manifest.mjs
      - tools/select-latest-zero-tag.mjs
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional stable v0.x.x release tag; otherwise deploy the latest stable 0.x release'
        required: false
        default: ''
  workflow_call:
    inputs:
      release_tag:
        description: Release tag created by the release workflow
        required: false
        type: string
      release_version:
        description: Release version created by the release workflow
        required: false
        type: string
  workflow_run:
    workflows:
      - Release & Publish
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: revelith-website-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish release manifest
    # The app's release workflow creates the GitHub release before its build
    # jobs upload installers. Its workflow_run event handles that completed
    # release; this release event is for releases published with assets ready.
    if: >-
      ${{
        (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
        (github.event_name != 'release' || github.event.release.assets[0] != null)
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the release commit for release events, or the source commit that
          # produced the release workflow run.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Select and validate a stable 0.x release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag || (github.event_name == 'release' && github.event.release.tag_name) || '' }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            TAG="$REQUESTED_TAG"
          else
            RELEASES_JSON="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease)"
            TAG="$(RELEASES_JSON="$RELEASES_JSON" node tools/select-latest-zero-tag.mjs)"
          fi
          [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
          VERSION="${TAG#v}"
          if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$VERSION" ]; then
            echo "Requested version $REQUESTED_VERSION does not match tag $TAG" >&2
            exit 1
          fi
          RELEASE_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets)"
          ACTUAL_TAG="$(jq -r '.tagName // empty' <<< "$RELEASE_JSON")"
          if [ "$ACTUAL_TAG" != "$TAG" ]; then
            echo "GitHub returned release tag '$ACTUAL_TAG' instead of '$TAG'." >&2
            exit 1
          fi
          if jq -e '.isDraft or .isPrerelease' <<< "$RELEASE_JSON" >/dev/null; then
            echo "Release $TAG is a draft or prerelease; only stable published releases can be deployed." >&2
            exit 1
          fi
          ASSETS="$(jq -c '[.assets[].name]' <<< "$RELEASE_JSON")"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_ASSETS=$ASSETS" >> "$GITHUB_ENV"
          echo "Deploying website manifest for $TAG."
        shell: bash

      - name: Generate and validate the release manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node apps/web/scripts/create-release-manifest.mjs
          test -s apps/web/public/release.json
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const manifest = JSON.parse(await readFile("apps/web/public/release.json", "utf8"));
            const prefix = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/`;
            if (manifest.version !== process.env.RELEASE_TAG || !manifest.downloads.length) {
              throw new Error("Generated release manifest has the wrong version or no downloads.");
            }
            for (const item of manifest.downloads) {
              const url = new URL(item.url);
              const filename = decodeURIComponent(url.pathname.split("/").at(-1));
              if (!item.url.startsWith(prefix) || filename !== item.format) {
                throw new Error(`Invalid direct download URL for ${item.format}.`);
              }
            }
          '
          while IFS= read -r url; do
            curl --fail --location --silent --show-error --head --retry 2 --retry-delay 2 "$url" >/dev/null
          done < <(node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const manifest = JSON.parse(await readFile("apps/web/public/release.json", "utf8"));
            for (const item of manifest.downloads) console.log(item.url);
          ')

      - name: Configure VPS SSH access
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Publish the release manifest to the live site
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_WEB_PATH: /var/www/revelith
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER"
          test "$VPS_WEB_PATH" = "/var/www/revelith"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh "$VPS_USER@$VPS_HOST" "set -eu; mkdir -p '$VPS_WEB_PATH'; test ! -L '$VPS_WEB_PATH'; test -d '$VPS_WEB_PATH'; test -w '$VPS_WEB_PATH'"
          # Update only the manifest; the independently hosted website bundle stays in place.
          rsync -az --delay-updates apps/web/public/release.json "$VPS_USER@$VPS_HOST:$VPS_WEB_PATH/release.json"
          ssh "$VPS_USER@$VPS_HOST" "chmod 644 '$VPS_WEB_PATH/release.json'"

      - name: Verify the public site and deployed manifest
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            https://revelith.averqel.com/ -o "$RUNNER_TEMP/deployed-index.html"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://revelith.averqel.com/release.json?deploy=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/deployed-release.json"
          EXPECTED_VERSION="$RELEASE_TAG" EXPECTED_REPOSITORY="$GITHUB_REPOSITORY" node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const manifest = JSON.parse(await readFile(process.argv[1], "utf8"));
            const prefix = `https://github.com/${process.env.EXPECTED_REPOSITORY}/releases/download/${process.env.EXPECTED_VERSION}/`;
            if (manifest.version !== process.env.EXPECTED_VERSION || !manifest.downloads.length) {
              throw new Error("Deployed release manifest has the wrong version or no downloads.");
            }
            for (const item of manifest.downloads) {
              const url = new URL(item.url);
              const filename = decodeURIComponent(url.pathname.split("/").at(-1));
              if (!item.url.startsWith(prefix) || filename !== item.format) {
                throw new Error(`Invalid direct download URL for ${item.format}.`);
              }
            }
          ' \
            "$RUNNER_TEMP/deployed-release.json"
