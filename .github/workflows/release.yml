name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release only a 0.x patch or minor version'
        type: choice
        options:
          - patch
          - minor
        required: true
        default: patch
      force_version:
        description: 'Optional override, must be a newer 0.x.x version (for example 0.11.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  semantic-release:
    name: Validate 0.x version and create release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.release.outputs.published }}
      new_release_version: ${{ steps.release.outputs.version }}
      new_release_git_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve a patch/minor version and create the GitHub release
        id: release
        env:
          FORCE_VERSION: ${{ inputs.force_version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node tools/release-version.mjs)"
          TAG="v$VERSION"
          NOTES_START_TAG="$(git tag --list 'v0.*' --sort=-version:refname | grep -E '^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sed -n '1p' || true)"
          NOTES_ARGS=()
          if [ -n "$NOTES_START_TAG" ]; then
            NOTES_ARGS+=(--notes-start-tag "$NOTES_START_TAG")
          fi
          echo "Creating release $TAG ($RELEASE_TYPE policy)"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "ReveLith $TAG" --generate-notes "${NOTES_ARGS[@]}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        shell: bash
  build-desktop:
    name: Build Desktop (${{ matrix.os }}${{ matrix.arch }})
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: universal
            mac_x64: '1'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/sheets/native/xlsx-engine -> apps/sheets/native/xlsx-engine/target'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64 rpm || sudo apt-get install -y libarchive-tools libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2 rpm || true

      - name: Install dependencies
        run: |
          npm ci --include=optional
          if [ "${{ runner.os }}" = "macOS" ]; then
            npm install --save-optional --include=optional @rollup/rollup-darwin-arm64 @rollup/rollup-darwin-x64
            npm install --prefix apps/docs --save-optional @rollup/rollup-darwin-arm64 @rollup/rollup-darwin-x64 || true
            npm install --prefix apps/sheets --save-optional @rollup/rollup-darwin-arm64 @rollup/rollup-darwin-x64 || true
            npm install --prefix apps/slides --save-optional @rollup/rollup-darwin-arm64 @rollup/rollup-darwin-x64 || true
            npm install --prefix apps/pdf --save-optional @rollup/rollup-darwin-arm64 @rollup/rollup-darwin-x64 || true
            npm install --prefix apps/markdown --save-optional @rollup/rollup-darwin-arm64 @rollup/rollup-darwin-x64 || true
            npm install --prefix apps/shell --save-optional @rollup/rollup-darwin-arm64 @rollup/rollup-darwin-x64 || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            if [ "${{ runner.arch }}" = "ARM64" ]; then
              ROLLUP_PKG="@rollup/rollup-linux-arm64-gnu"
            else
              ROLLUP_PKG="@rollup/rollup-linux-x64-gnu"
            fi
            npm install --save-optional --include=optional "$ROLLUP_PKG"
            npm install --prefix apps/docs --save-optional "$ROLLUP_PKG" || true
            npm install --prefix apps/sheets --save-optional "$ROLLUP_PKG" || true
            npm install --prefix apps/slides --save-optional "$ROLLUP_PKG" || true
            npm install --prefix apps/pdf --save-optional "$ROLLUP_PKG" || true
            npm install --prefix apps/markdown --save-optional "$ROLLUP_PKG" || true
            npm install --prefix apps/shell --save-optional "$ROLLUP_PKG" || true
          elif [ "${{ runner.os }}" = "Windows" ]; then
            npm install --save-optional --include=optional @rollup/rollup-win32-x64-msvc @rollup/rollup-win32-arm64-msvc || true
          fi
        shell: bash

      - name: Sync Semantic Release Version
        if: needs.semantic-release.outputs.new_release_version != ''
        run: |
          VERSION="${{ needs.semantic-release.outputs.new_release_version }}"
          echo "Setting release version to: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm version "$VERSION" --no-git-tag-version --allow-same-version -w @revelith/shell
        shell: bash

      - name: Run Workspace Typecheck
        run: npm run typecheck

      - name: Build Native Rust Sidecars
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            rustup target add x86_64-pc-windows-gnu aarch64-pc-windows-msvc || true
            cargo build --release --target x86_64-pc-windows-gnu --manifest-path apps/sheets/native/xlsx-engine/Cargo.toml || cargo build --release --manifest-path apps/sheets/native/xlsx-engine/Cargo.toml
            cargo build --release --target aarch64-pc-windows-msvc --manifest-path apps/sheets/native/xlsx-engine/Cargo.toml || true
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
            npm run native:build:universal -w @revelith/sheets
          else
            npm run native:build -w @revelith/sheets
          fi
        shell: bash

      - name: Build All Workspaces
        run: npm run build:all

      - name: Prepare Windows signing (if secrets provided)
        if: matrix.platform == 'win'
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK_B64 }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        run: |
          # electron-builder.cjs only signs under REVELITH_WIN_SIGN_MODE (see
          # scripts/win-sign.cjs) and never reads CSC_LINK directly: exporting it
          # alone used to produce unsigned installers that looked signed.
          if [ -n "$CSC_LINK_B64" ]; then
            echo "$CSC_LINK_B64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            echo "CSC_LINK=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          fi
          if [ -n "$AZURE_TRUSTED_SIGNING_ENDPOINT" ] || [ -n "$CSC_LINK_B64" ]; then
            echo "REVELITH_WIN_SIGN_MODE=production" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Pre-sign static Windows binaries (sidecar + OCR helper)
        if: matrix.platform == 'win' && env.REVELITH_WIN_SIGN_MODE != ''
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          # electron-builder does not sign extraResources: without this the
          # unsigned xlsx-sidecar.exe dies with "spawn UNKNOWN" on machines with
          # Smart App Control / WDAC, even when the installer itself is signed.
          node scripts/win-sign.cjs "$REVELITH_WIN_SIGN_MODE" "apps/sheets/native/xlsx-engine/target/x86_64-pc-windows-gnu/release/xlsx-sidecar.exe" || node scripts/win-sign.cjs "$REVELITH_WIN_SIGN_MODE" "apps/sheets/native/xlsx-engine/target/release/xlsx-sidecar.exe"
          node scripts/win-sign.cjs "$REVELITH_WIN_SIGN_MODE" "apps/sheets/native/xlsx-engine/target/aarch64-pc-windows-msvc/release/xlsx-sidecar.exe" || true
          node scripts/win-sign.cjs "$REVELITH_WIN_SIGN_MODE" "packages/pdf2docx/ocr-helper/win-ocr.exe" || true
        shell: bash

      - name: Package Desktop Artifacts (${{ matrix.platform }} ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVELITH_UPDATE_URL: ${{ secrets.REVELITH_UPDATE_URL }}
          REVELITH_WIN_SIGN_MODE: ${{ env.REVELITH_WIN_SIGN_MODE }}
          REVELITH_MAC_X64: ${{ matrix.mac_x64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            npm run dist:win
            # Second pass: Windows ARM64 installer. Own output dir + arm64
            # sidecar (see REVELITH_WIN_ARM64 in electron-builder.cjs); the
            # renderer bundle from dist:win is reused, unsigned like x64
            # unless signing secrets are configured.
            REVELITH_WIN_ARM64=1 BUILD_DIR=release-arm64 npm run dist:win:pack-only -w @revelith/shell
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            npm run dist:linux
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            npm run dist:mac
          fi
        shell: bash

      - name: Save this platform's build for one release publisher
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/shell/release/
            apps/shell/release-arm64/
          if-no-files-found: error
          retention-days: 2

  publish-release-assets:
    name: Publish all desktop assets (single writer)
    needs: [semantic-release, build-desktop]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts

      - name: Prepare unique, user-facing release assets
        run: node tools/prepare-release-assets.mjs release-artifacts release-assets

      - name: Upload assets once and verify the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.semantic-release.outputs.new_release_git_tag }}
        run: |
          set -euo pipefail
          mapfile -d '' ASSETS < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          test "${#ASSETS[@]}" -gt 0
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          ASSET_COUNT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          test "$ASSET_COUNT" -gt 0
          echo "Verified $ASSET_COUNT release assets on $TAG."
        shell: bash
